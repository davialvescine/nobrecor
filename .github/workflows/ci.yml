name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (TypeScript 7)
        run: npm run type-check

      - name: Testes
        run: npm test -- --run

      - name: Sanidade de rotas e slugs
        run: npm run check:rotas

      - name: Build
        run: npm run build

  thin-content:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sobe o site e mede conteúdo único
        run: |
          npx next start -p 3000 &
          npx wait-on http://localhost:3000 -t 60000
          npm run check:thin-content 3000

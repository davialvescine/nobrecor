version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Campo_Grande
    open-pull-requests-limit: 5
    # Majors ficam por conta da equipe (evita PR de breaking change automático)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
